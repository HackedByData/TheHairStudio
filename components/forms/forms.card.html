<!doctype html><html><head><meta charset="utf-8"><title>Forms</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>html,body{margin:0;background:var(--black-ink)}#root{padding:26px 28px}.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-disabled);margin-bottom:12px}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.cols{display:grid;gap:30px}</style></head><body><div id="root"></div><script type="text/babel">
const { Input, Select, Textarea, Checkbox, Switch, RadioGroup } = window.TheHairStudioDesignSystem_03d078;
function Demo(){const[v,setV]=React.useState('Balayage');const[c,setC]=React.useState(true);const[s,setS]=React.useState(true);const[r,setR]=React.useState('angie');
return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:30}}>
<div style={{display:'grid',gap:18,alignContent:'start'}}>
<Input label="Full name" placeholder="First and last" defaultValue="Catherine Salazar"/>
<Input label="Phone" icon="phone" placeholder="(909) 000-0000" hint="We text a reminder the day before."/>
<Input label="Email" icon="mail" defaultValue="not-an-email" error="Enter a valid email address."/>
<Select label="Service" value={v} onChange={e=>setV(e.target.value)} options={['Balayage','Full highlights','Root touch-up','Brazilian blowout']}/>
</div>
<div style={{display:'grid',gap:18,alignContent:'start'}}>
<RadioGroup label="Stylist" value={r} onChange={setR} options={[{value:'angie',label:'Angie',meta:'Owner · 12 yrs'},{value:'larissa',label:'Larissa',meta:'Color'},{value:'any',label:'First available'}]}/>
<Textarea label="Notes" rows={3} placeholder="Previous color, allergies, inspiration…"/>
<div style={{display:'grid',gap:14}}>
<Checkbox label="Text me a reminder" description="The day before, once." checked={c} onChange={e=>setC(e.target.checked)}/>
<Checkbox label="Disabled option" checked={false} disabled/>
<Switch label="Marketing emails" checked={s} onChange={e=>setS(e.target.checked)}/></div>
</div></div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
