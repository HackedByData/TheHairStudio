<!doctype html><html><head><meta charset="utf-8"><title>Lines & veils</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--black-ink);font-family:var(--font-sans)}.p{padding:22px 26px}.g{display:grid}.lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-disabled)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body class="p"><div class="g" style="grid-template-columns:repeat(4,1fr);gap:16px">
 <div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:var(--black-raised);border:1px solid rgba(255,255,255,.06);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">line-faint</div><div class="mono">rgba(255,255,255,.06)</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:var(--black-raised);border:1px solid rgba(255,255,255,.11);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">line-hairline</div><div class="mono">rgba(255,255,255,.11)</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:var(--black-raised);border:1px solid rgba(255,255,255,.22);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">line-strong</div><div class="mono">rgba(255,255,255,.22)</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:var(--black-raised);border:1px solid rgba(140,28,43,.45);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">line-accent</div><div class="mono">rgba(140,28,43,.45)</div></div></div></body></html>
