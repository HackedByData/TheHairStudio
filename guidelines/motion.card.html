<!doctype html><html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--black-ink);font-family:var(--font-sans)}.p{padding:22px 26px}.g{display:grid}.lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-disabled)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body class="p"><div class="g" style="gap:12px"><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:110px">--dur-instant</span><span style="font-size:13px;color:var(--text-secondary);width:60px">90ms</span><span style="font-size:13px;color:var(--text-muted)">press feedback</span></div><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:110px">--dur-fast</span><span style="font-size:13px;color:var(--text-secondary);width:60px">140ms</span><span style="font-size:13px;color:var(--text-muted)">colour, hover</span></div><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:110px">--dur-base</span><span style="font-size:13px;color:var(--text-secondary);width:60px">240ms</span><span style="font-size:13px;color:var(--text-muted)">panels, toasts</span></div><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:110px">--dur-slow</span><span style="font-size:13px;color:var(--text-secondary);width:60px">480ms</span><span style="font-size:13px;color:var(--text-muted)">image scale</span></div><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:110px">--dur-reveal</span><span style="font-size:13px;color:var(--text-secondary);width:60px">900ms</span><span style="font-size:13px;color:var(--text-muted)">scroll-in fade + 8px rise</span></div>
 <div class="mono" style="margin-top:6px">standard cubic-bezier(.22,.61,.36,1) · out-soft cubic-bezier(.16,1,.30,1)</div></div></body></html>
