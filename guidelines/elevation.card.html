<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation on black" subtitle="Hairline first, shadow second, oxblood glow for focus" -->
<!doctype html><html><head><meta charset="utf-8"><title>Elevation on black</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--black-ink);font-family:var(--font-sans)}.p{padding:22px 26px}.g{display:grid}.lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-disabled)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body class="p"><div class="g" style="grid-template-columns:repeat(6,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--black-raised);box-shadow:inset 0 0 0 1px rgba(255,255,255,.11);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">hairline</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--black-raised);box-shadow:0 1px 2px rgba(0,0,0,.65);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">sm</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--black-raised);box-shadow:0 8px 24px rgba(0,0,0,.55);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">md</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--black-raised);box-shadow:0 24px 60px rgba(0,0,0,.62);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">lg</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--black-raised);box-shadow:0 40px 120px rgba(0,0,0,.78);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">modal</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--black-raised);box-shadow:0 0 0 1px rgba(140,28,43,.45),0 0 28px rgba(140,28,43,.16);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">glow-accent</div></div></div></body></html>
