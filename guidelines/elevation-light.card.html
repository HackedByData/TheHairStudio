<!doctype html><html><head><meta charset="utf-8"><title>Elevation on bone</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--black-ink);font-family:var(--font-sans)}.p{padding:22px 26px}.g{display:grid}.lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-disabled)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body class="p"><div style="background:var(--bone-100);margin:-22px -26px;padding:26px"><div class="g" style="grid-template-columns:repeat(3,1fr);gap:20px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:66px;background:var(--bone-50);box-shadow:0 1px 2px rgba(30,24,16,.06);border-radius:14px"></div><div class="lab" style="color:var(--stone-500)">light-sm</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:66px;background:var(--bone-50);box-shadow:0 10px 30px rgba(30,24,16,.10);border-radius:14px"></div><div class="lab" style="color:var(--stone-500)">light-md</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:66px;background:var(--bone-50);box-shadow:0 30px 70px rgba(30,24,16,.14);border-radius:14px"></div><div class="lab" style="color:var(--stone-500)">light-lg</div></div></div></div></body></html>
