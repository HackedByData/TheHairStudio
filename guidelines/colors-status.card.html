<!doctype html><html><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--black-ink);font-family:var(--font-sans)}.p{padding:22px 26px}.g{display:grid}.lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-disabled)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body class="p"><div class="g" style="grid-template-columns:repeat(4,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:#7FA37A;border:1px solid var(--line-faint);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">confirmed</div><div class="mono">#7FA37A</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:#D9A441;border:1px solid var(--line-faint);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">pending</div><div class="mono">#D9A441</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:#C15F52;border:1px solid var(--line-faint);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">cancelled</div><div class="mono">#C15F52</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="height:56px;background:#7E97A8;border:1px solid var(--line-faint);border-radius:2px"></div><div class="lab" style="color:var(--text-secondary)">info</div><div class="mono">#7E97A8</div></div></div></body></html>
